; ExpressLRS PlatformIO Project Configuration File

[platformio]
extra_configs =
	# keep common first
	targets/common.ini
	targets/esp32-tx.ini
	targets/esp32s3-tx.ini
	targets/esp32c3-tx.ini
	targets/esp8285-tx.ini
	targets/esp32-rx.ini
	targets/esp32s3-rx.ini
	targets/esp32c3-rx.ini
	targets/esp8285-rx.ini

# ------------------------- TARGET ENV DEFINITIONS -----------------

[env:native]
platform = native
framework =
test_ignore = test_embedded
lib_ignore = BUTTON, DAC, LQCALC, LBT, SPIEx, PWM, WIFI, TCPSOCKET, LR1121Driver, SX127xDriver
build_src_filter = ${common_env_data.build_src_filter} -<ESP32*.*> -<ESP8*.*> -<tx_*.cpp> -<rx_*.cpp> -<common.*> -<config.*>
build_flags =
	-std=c++11
	-Iinclude
	-D PROGMEM=""
	-D UNIT_TEST=1
	-D TARGET_NATIVE

[env:BETAFPV_Micro_1W_2400_TX]
extends = env:Unified_ESP32_2400_TX_via_UART
board_config = betafpv.tx_2400.micro1w
build_flags =
    ${env:Unified_ESP32_2400_TX_via_UART.build_flags}
    -DRegulatory_Domain_ISM_2400
    -DMY_BINDING_PHRASE="Tronfiuture003"

[env:BETAFPV_SuperD_2400_RX]
extends = env:Unified_ESP32_2400_RX_via_UART
board_config = betafpv.rx_2400.superd
build_flags =
    ${env:Unified_ESP32_2400_RX_via_UART.build_flags}
    -DRegulatory_Domain_ISM_2400
    -DMY_BINDING_PHRASE="Tronfiuture003"